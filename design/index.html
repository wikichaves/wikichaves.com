<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wiki Chaves — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0c;
    --ink: #ece8de;
    --ink-dim: #a8a295;
    --ink-faint: #6a6558;
    --rule: #26241f;
    --accent: #d98b5f;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--sans);
    min-height: 100vh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    padding: 32px 48px;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-dim);
    display: flex; align-items: center; gap: 10px;
  }
  .mark a { color: var(--ink-dim); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .mark .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 48px;
  }
  .intro { max-width: 640px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(44px, 6vw, 84px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 40px;
    text-wrap: pretty;
  }
  h1 em { font-style: italic; color: var(--ink-dim); }
  p {
    font-family: var(--serif);
    font-size: 20px; line-height: 1.65;
    color: var(--ink-dim);
    margin: 0 0 32px;
    max-width: 520px;
  }
  .links {
    display: flex; gap: 28px;
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    margin-top: 48px;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    transition: border-color .25s, color .25s;
  }
  .links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .links a::after { content: " →"; color: var(--ink-faint); transition: color .25s; }
  .links a:hover::after { color: var(--accent); }
  footer {
    padding: 32px 48px;
    font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-faint);
  }
</style>
</head>
<body>
  <header class="mark"><a href="/"><span class="dot"></span> Wiki Chaves · Design</a></header>

  <main>
    <div class="intro">
      <div class="eyebrow">Placeholder · design</div>
      <h1>A portfolio, <em>currently being pressed.</em></h1>
      <p>Case studies, product work, and design explorations will live here soon. In the meantime, you can listen to the records.</p>
      <div class="links">
        <a href="/">Home</a>
        <a href="/music">Music</a>
      </div>
    </div>
  </main>

  <footer>© Wiki Chaves · Made slowly in Uruguay</footer>
</body>
</html>
