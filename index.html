<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wiki Chaves</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .hero {
    padding: clamp(80px, 14vh, 160px) 0 clamp(64px, 10vh, 120px);
  }
  .hero .display {
    margin-bottom: 40px;
    max-width: 12ch;
  }
  .hero .display em { color: var(--ink-dim); font-style: italic; }
  .hero .lede { margin-bottom: 56px; max-width: 520px; }
  .hero .link-list { margin-top: 8px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 28px;
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow .line { width: 32px; height: 1px; background: var(--ink-faint); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-mark"><span class="dot"></span> Wiki Chaves</a>
    <div class="nav-links">
      <a href="/design">Design</a>
      <a href="/music">Music</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow"><span class="line"></span> Uruguay</div>
      <h1 class="display">Designer &amp; <em>musician.</em></h1>
      <p class="lede">I make instrumental records and design software — usually in quiet rooms, near the coast, with a cup of coffee in hand.</p>
      <div class="link-list">
        <a href="/design">Design</a>
        <a href="/music">Music</a>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="foot-meta">
    <span>© Wiki Chaves · Made slowly in Uruguay</span>
    <nav>
      <a href="/design">Design</a>
      <a href="/music">Music</a>
    </nav>
  </div>
</footer>

</body>
</html>
