<style>
  .hero {
    padding: clamp(80px, 14vh, 160px) 0 clamp(40px, 6vh, 72px);
  }
  .hero .display {
    margin-bottom: 40px;
    max-width: 12ch;
  }
  .hero .display em { color: var(--accent); font-style: italic; }
  .hero .lede { margin-bottom: 18px; max-width: 520px; }
  .hero .aside {
    margin: 0 0 56px;
    max-width: 520px;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink-dim);
    font-style: italic;
  }
  .hero .aside a {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-2);
    transition: color .2s, border-color .2s;
  }
  .hero .aside a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .hero .link-list { margin-top: 8px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 28px;
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow .line { width: 32px; height: 1px; background: var(--ink-faint); }

  /* Use dynamic viewport height so the home fits in the actually-visible area,
     even when iOS Safari's URL bar is showing. body in shared.css already has
     min-height: 100vh; this override handles modern mobile browsers. */
  body { min-height: 100dvh; }

  /* Standard desktop: tighten the hero so it fits in one viewport (no scroll).
     Mobile and very tall screens keep the original generous padding. */
  @media (min-width: 901px) and (min-height: 700px) and (max-height: 1100px) {
    .hero { padding: clamp(48px, 8vh, 120px) 0 clamp(20px, 3vh, 48px); }
    .hero .display { margin-bottom: 32px; }
    .hero .aside { margin-bottom: 40px; }
  }

  /* Mobile: same idea — tighten so hero + nav + footer fit in 100dvh. */
  @media (max-width: 900px) {
    .hero { padding: clamp(40px, 6vh, 80px) 0 clamp(20px, 3vh, 40px); }
    .hero .display { margin-bottom: 24px; }
    .hero .lede { margin-bottom: 12px; }
    .hero .aside { margin-bottom: 28px; }
    .eyebrow { margin-bottom: 20px; }
  }

  /* Subtle live ambient — sits behind nav, hero, and footer for a continuous read */
  .live-bg {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 60%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .foot { position: relative; z-index: 1; }
  .live-bg .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    will-change: transform;
    mix-blend-mode: screen;
  }
  /* Lime-green, biggest, top-right */
  .live-bg .blob-1 {
    width: 560px; height: 480px;
    top: 4%; right: -140px;
    background: radial-gradient(circle, hsla(75, 60%, 55%, 0.22), hsla(75, 60%, 55%, 0) 70%);
    animation: drift1 22s ease-in-out infinite;
  }
  /* Cooler green, mid-low */
  .live-bg .blob-2 {
    width: 440px; height: 440px;
    bottom: 6%; right: 28%;
    background: radial-gradient(circle, hsla(95, 45%, 50%, 0.16), hsla(95, 45%, 50%, 0) 70%);
    animation: drift2 28s ease-in-out infinite;
  }
  /* Warm yellow-green, smaller, mid-right */
  .live-bg .blob-3 {
    width: 320px; height: 360px;
    top: 38%; right: 8%;
    background: radial-gradient(circle, hsla(60, 65%, 60%, 0.14), hsla(60, 65%, 60%, 0) 70%);
    animation: drift3 34s ease-in-out infinite;
  }
  .wrap { position: relative; z-index: 1; }

  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%  { transform: translate(-50px, 70px) scale(1.1) rotate(15deg); }
    66%  { transform: translate(40px, 30px) scale(0.95) rotate(-10deg); }
    100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  @keyframes drift2 {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%  { transform: translate(60px, -50px) scale(1.05) rotate(-12deg); }
    66%  { transform: translate(-30px, -80px) scale(0.92) rotate(18deg); }
    100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  @keyframes drift3 {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    33%  { transform: translate(-40px, -40px) scale(1.12) rotate(20deg); }
    66%  { transform: translate(50px, 40px) scale(0.9) rotate(-15deg); }
    100% { transform: translate(0, 0) scale(1) rotate(0deg); }
  }

  @media (max-width: 900px) {
    .live-bg { width: 100%; }
    .live-bg .blob-1 { width: 380px; height: 340px; right: -100px; top: 8%; }
    .live-bg .blob-2 { width: 320px; height: 320px; right: 40%; bottom: 14%; }
    .live-bg .blob-3 { width: 240px; height: 280px; right: 12%; top: 44%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-bg .blob { animation: none; }
  }
</style>
