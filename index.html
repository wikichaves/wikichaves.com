<link rel="stylesheet" href="shared.css?v=2">
<style>
  .hero {
    padding: clamp(80px, 14vh, 160px) 0 clamp(40px, 6vh, 72px);
  }
  .hero .display {
    margin-bottom: 40px;
    max-width: 12ch;
  }
  .hero .display em { color: var(--accent); font-style: italic; }
  .hero .lede { margin-bottom: 18px; max-width: 520px; }
  .hero .aside {
    margin: 0 0 56px;
    max-width: 520px;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink-dim);
    font-style: italic;
  }
  .hero .aside a {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-2);
    transition: color .2s, border-color .2s;
  }
  .hero .aside a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .hero .link-list { margin-top: 8px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 28px;
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow .line { width: 32px; height: 1px; background: var(--ink-faint); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-mark"><img class="mark" src="/uploads/wikichaves.svg" alt=""> Wiki Chaves</a>
    <div class="nav-links">
      <a href="/design">Design</a>
      <a href="/music">Music</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <section class="hero">
      <div class="eyebrow"><span class="line"></span> Based in Uruguay</div>
      <h1 class="display">Designer &amp; <em>musician.</em></h1>
      <p class="lede">I design software and make instrumental records mostly from home.</p>
      <p class="aside"><em>Lately, also building <a href="https://casabosquemontoya.com/" target="_blank" rel="noopener">cabins in the woods</a>.</em></p>
      <div class="link-list">
        <a href="/design">Design</a>
        <a href="/music">Music</a>
      </div>
    </section>
  </div>
</main>

<footer class="foot">
  <div class="foot-meta">
    <span>© Wiki Chaves</span>
    <a href="#" class="contact-link" data-u="d2lraWNoYXZlcw==" data-d="Z21haWwuY29t">Contact</a>
  </div>
</footer>
<script>
  (function(){
    document.querySelectorAll('.contact-link').forEach(function(a){
      var email = atob(a.dataset.u) + '@' + atob(a.dataset.d);
      a.addEventListener('click', function(e){
        e.preventDefault();
        window.location.href = 'mailto:' + email;
      });
    });
  })();
</script>



</body></html>
